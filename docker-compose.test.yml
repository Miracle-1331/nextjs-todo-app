# Extend docker-compose.yml for automated DB-integration validation.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from db-test
#
# Runs a lightweight test suite (curl-based) against the live app+db stack:
#   1. Waits for /api/health to return 200
#   2. Creates a todo  (POST)
#   3. Lists todos     (GET) and confirms the new one is present
#   4. Toggles done    (PATCH)
#   5. Verifies update (GET /:id)
#   6. Deletes it      (DELETE)
#   7. Confirms 404    (GET /:id)
#   8. Confirms DB has 0 rows via psql

services:

  db-test:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: todos_pass
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache curl > /dev/null 2>&1

        BASE="http://app:3000"
        PASS=0; FAIL=0

        ok()   { echo "[PASS] $1"; PASS=$((PASS+1)); }
        fail() { echo "[FAIL] $1"; FAIL=$((FAIL+1)); }

        assert_status() {
          local label="$1" expected="$2" actual="$3"
          [ "$actual" = "$expected" ] && ok "$label (HTTP $actual)" || fail "$label — expected $expected, got $actual"
        }

        echo ""
        echo "======================================="
        echo "  Todo App — DB Integration Test Suite "
        echo "======================================="
        echo ""

        # 1. Health check
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/health")
        assert_status "GET /api/health" 200 "$STATUS"

        # 2. Create todo
        BODY=$(curl -s -X POST "$BASE/api/todos" \
          -H "Content-Type: application/json" \
          -d '{"title":"Integration test task"}')
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/api/todos" \
          -H "Content-Type: application/json" \
          -d '{"title":"dummy"}')
        assert_status "POST /api/todos" 201 "$STATUS"

        # Extract id from creation response
        TODO_ID=$(echo "$BODY" | grep -o '"id":"[^"]*"' | head -1 | sed 's/"id":"//;s/"//')
        [ -n "$TODO_ID" ] && ok "Response contains id ($TODO_ID)" || fail "Response missing id — body: $BODY"

        # 3. List todos — should contain our entry
        LIST=$(curl -s "$BASE/api/todos")
        echo "$LIST" | grep -q "Integration test task" \
          && ok "GET /api/todos — title present in list" \
          || fail "GET /api/todos — title not found in list"

        # 4. Patch todo — mark completed
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "$BASE/api/todos/$TODO_ID" \
          -H "Content-Type: application/json" \
          -d '{"completed":true}')
        assert_status "PATCH /api/todos/:id (completed=true)" 200 "$STATUS"

        # 5. Verify update persisted
        ITEM=$(curl -s "$BASE/api/todos/$TODO_ID")
        echo "$ITEM" | grep -q '"completed":true' \
          && ok "GET /api/todos/:id — completed flag persisted in DB" \
          || fail "GET /api/todos/:id — completed flag not persisted; body: $ITEM"

        # 6. Delete todo
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "$BASE/api/todos/$TODO_ID")
        assert_status "DELETE /api/todos/:id" 204 "$STATUS"

        # 7. Confirm 404 after delete
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/todos/$TODO_ID")
        assert_status "GET /api/todos/:id after DELETE" 404 "$STATUS"

        # 8. Validate directly in Postgres — table should be empty of our row
        ROW_COUNT=$(psql -h db -U todos_user -d todos -tAc \
          "SELECT COUNT(*) FROM todos WHERE title = 'Integration test task'")
        [ "$ROW_COUNT" = "0" ] \
          && ok "DB row count for test title = 0 (row deleted)" \
          || fail "DB still contains $ROW_COUNT row(s) for test title"

        echo ""
        echo "---------------------------------------"
        echo "  Results: $PASS passed, $FAIL failed"
        echo "---------------------------------------"
        echo ""

        [ "$FAIL" = "0" ] && exit 0 || exit 1
