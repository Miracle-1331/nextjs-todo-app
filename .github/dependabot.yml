# Dependabot keeps dependencies and pinned action SHAs current.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # ── Application dependencies (npm) ──────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "npm"]
    groups:
      # Batch low-risk updates into a single PR to cut review noise.
      minor-and-patch:
        update-types: ["minor", "patch"]

  # ── GitHub Actions (keeps SHA-pinned actions fresh) ─────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]

  # ── Container base image (Dockerfile) ───────────────────────────────────────
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "docker"]
