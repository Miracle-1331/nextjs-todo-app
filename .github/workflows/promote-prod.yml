name: Promote to Production

# Stage 4 — Manual production promotion.
# Does NOT rebuild. Verifies the full signed supply chain (signature, SBOM,
# build provenance, and the QA-approval issued by promote-qa.yml) BEFORE asking
# a human to approve. Only a QA-approved digest can reach this point. After a
# successful prod rollout it signs the final prod-approval record.

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Image digest to promote (e.g. sha256:abc123…)"
        required: true
        type: string

# Serialise production promotions — only one may touch prod GitOps state at a time.
concurrency:
  group: promote-prod-nextjs-todo-app
  cancel-in-progress: false

env:
  APP_NAME: nextjs-todo-app
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  AWS_REGION: ap-southeast-1 # must match where main-release builds/pushes
  COSIGN_KEY: awskms:///alias/extreme-lab-dev-cosign
  VAULT_URL: https://vault.merveilles.org
  VAULT_AUTH_PATH: github-actions
  VAULT_ROLE: gha-agent-ci
  YQ_VERSION: "v4.44.3"
  ARGOCD_VERSION: "v2.13.3"

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Step 1-6 · Verify the full signed supply-chain BEFORE the human gate.
  #   image signature + SBOM (cosign/KMS), build provenance (main-release.yml),
  #   and the qa-approval (gh attestation, signed by promote-qa.yml, env=qa).
  # qa-approval only exists if promote-qa itself verified dev-approval first, so
  # "prod requires qa requires dev" is enforced cryptographically end-to-end.
  # ─────────────────────────────────────────────────────────────────────────────
  verify-chain:
    name: "1-6 · Verify Signed Promotion Chain"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # AWS OIDC for ECR/KMS read
      contents: read
      attestations: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Validate digest format
        run: |
          DIGEST="${{ inputs.image_digest }}"
          if ! echo "$DIGEST" | grep -qE '^sha256:[a-f0-9]{64}$'; then
            echo "ERROR: image_digest must match sha256:<64-hex-chars>"
            exit 1
          fi
          echo "Digest format OK: $DIGEST"

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Verify image signature (Cosign / KMS)
        run: |
          cosign verify \
            --key "${{ env.COSIGN_KEY }}" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ inputs.image_digest }}"

      - name: Verify SBOM attestation (Cosign / KMS)
        run: |
          cosign verify-attestation \
            --type cyclonedx \
            --key "${{ env.COSIGN_KEY }}" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ inputs.image_digest }}"

      - name: Verify build provenance (SLSA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify \
            "oci://${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ inputs.image_digest }}" \
            --owner "${{ github.repository_owner }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/main-release.yml" \
            --predicate-type "https://slsa.dev/provenance/v1"

      - name: Verify qa-approval record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Requires a .../promotion/qa/v1 attestation for THIS digest, signed by
          # promote-qa.yml — which is only produced after QA E2E/smoke/DAST pass
          # AND promote-qa verified the dev-approval. This is the prod gate.
          gh attestation verify \
            "oci://${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ inputs.image_digest }}" \
            --owner "${{ github.repository_owner }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/promote-qa.yml" \
            --predicate-type "https://extreme-lab.dev/promotion/qa/v1"

      - name: Resolve promoted tag from ECR
        id: meta
        run: |
          set -euo pipefail
          TAG=$(aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --image-ids imageDigest="${{ inputs.image_digest }}" \
            --query 'imageDetails[0].imageTags[0]' --output text)
          if [ -z "$TAG" ] || [ "$TAG" = "None" ]; then
            echo "ERROR: no tag found in ECR for digest ${{ inputs.image_digest }}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Verified & resolved tag ${TAG} for ${{ inputs.image_digest }}"

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 7 · Human approval gate — only reached once the chain is fully verified.
  # The "prod" GitHub Environment enforces required reviewers here.
  # ─────────────────────────────────────────────────────────────────────────────
  approve-prod:
    name: "7 · Human Approval"
    runs-on: ubuntu-latest
    needs: verify-chain
    environment: prod
    timeout-minutes: 60
    steps:
      - name: Record approval
        run: |
          echo "Supply chain verified (sig ✓ SBOM ✓ provenance ✓ qa-approval ✓)."
          echo "Approved by required reviewer for digest ${{ inputs.image_digest }}."

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 8-9 · Update prod values + create GitOps PR (CODEOWNERS review required)
  # ─────────────────────────────────────────────────────────────────────────────
  update-prod-values:
    name: "8-9 · Update Prod Values"
    runs-on: ubuntu-latest
    needs: [verify-chain, approve-prod]
    timeout-minutes: 10
    permissions:
      id-token: write # Vault JWT auth
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/github/gitops-token token | GITOPS_TOKEN ;

      - name: Checkout GitOps repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ env.GITOPS_TOKEN }}

      - name: Install yq
        run: |
          curl -sSL \
            "https://github.com/mikefarah/yq/releases/download/${{ env.YQ_VERSION }}/yq_linux_amd64" \
            -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq

      - name: Step 8 — Update values/prod.yaml with verified digest + tag
        run: |
          COMMIT="${{ needs.verify-chain.outputs.commit }}"
          yq -i ".image.digest = \"${{ inputs.image_digest }}\"" "workloads/todo-app/prod/values.yaml"
          yq -i ".image.tag = \"${COMMIT}\"" "workloads/todo-app/prod/values.yaml"

      - name: Step 9 — Create production GitOps PR
        run: |
          BRANCH="promote/${{ env.APP_NAME }}/prod/${{ inputs.image_digest }}"
          BRANCH="${BRANCH:0:100}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$BRANCH"
          git add "workloads/todo-app/prod/values.yaml"
          git commit -m "chore: promote ${{ env.APP_NAME }} to prod @ ${{ inputs.image_digest }}"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --repo "${{ env.GITOPS_REPO }}" \
            --title "[PROD] Promote ${{ env.APP_NAME }} to production" \
            --body "**Production promotion** of digest \`${{ inputs.image_digest }}\`.
          - Promoted by: ${{ github.actor }}
          - Pipeline run: ${{ github.run_id }}
          - Supply chain verified: signature ✓ SBOM ✓ provenance ✓ qa-approval ✓

          Requires CODEOWNERS approval before merge." \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ env.GITOPS_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 10-11 · Argo CD sync prod + production canary rollout
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: "10-11 · Deploy Prod + Canary"
    runs-on: ubuntu-latest
    needs: update-prod-values
    environment: prod
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Install Argo CD CLI
        run: |
          curl -sSL \
            "https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64" \
            -o /usr/local/bin/argocd && chmod +x /usr/local/bin/argocd

      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/argocd/ci-token token | ARGOCD_TOKEN ;

      - name: Argo CD login
        run: |
          argocd login "${{ vars.ARGOCD_SERVER }}" \
            --auth-token "${{ env.ARGOCD_TOKEN }}" \
            --grpc-web

      - name: Sync production application
        run: |
          argocd app sync "${{ env.APP_NAME }}-prod" \
            --force --prune --timeout 300

      - name: Wait for production rollout healthy
        run: |
          argocd app wait "${{ env.APP_NAME }}-prod" \
            --health --timeout 300

      # Argo Rollouts AnalysisTemplate validates SLO metrics during canary steps.
      # The Analysis reads from Prometheus/CloudWatch/Datadog — configure in the
      # AnalysisTemplate manifest in the GitOps repo, not here.
      # TODO: uncomment when Helm chart supports Argo Rollouts
      # - name: Wait for production canary to complete
      #   run: |
      #     kubectl --server "${{ vars.PROD_KUBE_SERVER }}" \
      #             --token  "${{ env.PROD_KUBE_TOKEN }}" \
      #       argo rollouts status "${{ env.APP_NAME }}" \
      #         --namespace prod --timeout 1200

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 12 · Smoke test against production
  # ─────────────────────────────────────────────────────────────────────────────
  smoke-prod:
    name: "12 · Smoke Test — Prod"
    runs-on: ubuntu-latest
    needs: deploy-prod
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Health check
        run: |
          URL="${{ vars.PROD_APP_URL }}"
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${URL}/api/health")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed — HTTP ${STATUS}"
            exit 1
          fi
          echo "Health check passed (HTTP ${STATUS})"

      - name: Core API smoke tests
        run: |
          URL="${{ vars.PROD_APP_URL }}"
          curl -sf "${URL}/api/todos" -o /dev/null && echo "GET /api/todos OK"

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 13 · Notify release channel (Slack)
  # ─────────────────────────────────────────────────────────────────────────────
  notify:
    name: "13 · Notify Release Channel"
    runs-on: ubuntu-latest
    needs: smoke-prod
    if: always()
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/slack/webhook-url url | SLACK_WEBHOOK_URL ;

      - name: Build notification payload
        id: payload
        run: |
          STATUS="${{ needs.smoke-prod.result }}"
          if [ "$STATUS" = "success" ]; then
            COLOR="good"
            MSG="Production deployment *succeeded* for \`${{ env.APP_NAME }}\`."
          else
            COLOR="danger"
            MSG="Production deployment *failed* for \`${{ env.APP_NAME }}\`."
          fi
          echo "color=${COLOR}" >> "$GITHUB_OUTPUT"
          echo "msg=${MSG}" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [{
                "color": "${{ steps.payload.outputs.color }}",
                "text": "${{ steps.payload.outputs.msg }}",
                "fields": [
                  { "title": "Digest", "value": "${{ inputs.image_digest }}", "short": false },
                  { "title": "Promoted by", "value": "${{ github.actor }}", "short": true },
                  { "title": "Run", "value": "${{ github.run_id }}", "short": true }
                ]
              }]
            }

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 14 · Sign the final prod-approval record (keyless, GitHub OIDC).
  # Completes the attestation chain: dev → qa → prod, all bound to the digest.
  # ─────────────────────────────────────────────────────────────────────────────
  attest-prod-approval:
    name: "14 · Attest Prod Approval"
    runs-on: ubuntu-latest
    needs: [verify-chain, smoke-prod]
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Build prod-approval predicate
        run: |
          set -euo pipefail
          cat > approval.json <<EOF
          {
            "environment": "prod",
            "requires": "qa",
            "image": "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}",
            "digest": "${{ inputs.image_digest }}",
            "tag": "${{ needs.verify-chain.outputs.tag }}",
            "commit": "${{ needs.verify-chain.outputs.commit }}",
            "source_repo": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}",
            "promoted_by": "${{ github.actor }}",
            "validated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "evidence": { "smoke": "passed" }
          }
          EOF

      - name: Sign prod-approval attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          subject-digest: ${{ inputs.image_digest }}
          predicate-type: https://extreme-lab.dev/promotion/prod/v1
          predicate-path: approval.json
          push-to-registry: false
