name: Main Release

# Stage 2 — Merge to main.
# Builds the official release candidate artifact once.
# Scans once, signs once, deploys to dev, runs DAST.
# Does NOT trigger on PRs — only on commits landing on main.

on:
  push:
    branches: [main]
    # Allow-list: only (re)build + deploy when something that goes INTO the image
    # or the deployment actually changes. Editing docs, workflows, or test-only
    # config no longer ships a new image and redeploys. Anything not listed here
    # is treated as non-shipping. Use the manual trigger to force a re-release.
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - "next.config.ts"
      - "tsconfig.json"
      - "migrations/**"
  # Manual escape hatch — re-release the current main HEAD without a code change
  # (e.g. after changing this workflow, or to redeploy an existing digest).
  workflow_dispatch: {}

concurrency:
  group: main-release-nextjs-todo-app
  cancel-in-progress: false # never cancel a release in flight

# Serialise releases — only one at a time, never cancel an in-flight one.
# A second qualifying push waits until the current release finishes.

env:
  NODE_VERSION: "24"
  IMAGE_NAME: nextjs-todo-app
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }} # e.g. 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }} # e.g. extreme-lab/todo-app
  GITOPS_REPO: ${{ vars.GITOPS_REPO }} # e.g. org/gitops-repo
  APP_NAME: nextjs-todo-app
  VAULT_URL: https://vault.merveilles.org
  VAULT_AUTH_PATH: github-actions
  YQ_VERSION: "v4.44.3"
  ARGOCD_VERSION: "v2.13.3"

permissions: {}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Step 5 · Check if image already exists in ECR (immutable tags block re-push)
  # ─────────────────────────────────────────────────────────────────────────────
  check-image:
    name: "Check Existing Image"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      digest: ${{ steps.check.outputs.digest }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if image tag already exists in ECR
        id: check
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --image-ids imageTag="${{ github.sha }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || echo "")
          if [ -n "$DIGEST" ] && [ "$DIGEST" != "None" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "Image already exists: ${DIGEST} — skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "Image not found — will build"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 6 · Build platform images natively in parallel (no QEMU emulation)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "Build (${{ matrix.suffix }})"
    needs: check-image
    if: needs.check-image.outputs.exists == 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      # Egress monitoring — start in 'audit' to learn traffic, switch to 'block'
      # with an allowed-endpoints list once the baseline is known.
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push platform image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,scope=${{ matrix.suffix }},mode=max
          provenance: false

  # ─────────────────────────────────────────────────────────────────────────────
  # Steps 1-4, 6(merge)-13 · Merge manifest · Scan · SBOM · Sign · GitOps
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: "Merge · Scan · Sign · GitOps"
    needs: [check-image, build]
    if: always() && needs.check-image.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      security-events: write
      attestations: write # GitHub-native SLSA build provenance
    outputs:
      image-digest: ${{ steps.resolve-digest.outputs.digest }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      # ── Step 1 ────────────────────────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # ── Step 2 ────────────────────────────────────────────────────────────────
      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Step 3 ────────────────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      # ── Step 4 ────────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # ── Step 6 (merge) · Combine platform images into a multi-arch manifest ──
      - name: Create and push multi-arch manifest
        if: needs.check-image.outputs.exists == 'false'
        run: |
          docker buildx imagetools create \
            --tag "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-amd64" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-arm64"

      - name: Resolve image digest
        id: resolve-digest
        run: |
          if [ "${{ needs.check-image.outputs.exists }}" = "true" ]; then
            DIGEST="${{ needs.check-image.outputs.digest }}"
          else
            DIGEST=$(aws ecr describe-images \
              --repository-name "${{ env.ECR_REPOSITORY }}" \
              --image-ids imageTag="${{ github.sha }}" \
              --query 'imageDetails[0].imageDigest' \
              --output text)
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Resolved digest: ${DIGEST}"

      # ── Step 7 · Scan the pushed image by its immutable digest ───────────────
      - name: Trivy — image scan by digest (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ steps.resolve-digest.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true

      - name: Upload image scan SARIF
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        if: success() || failure() # code scanning is free on public repos
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-main

      # ── Step 8 · Generate SBOM (CycloneDX) ───────────────────────────────────
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ steps.resolve-digest.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      # ── Fetch release secrets from Vault (covers steps 11, 12) ─────────────
      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: gha-agent-ci
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/github/gitops-token token | GITOPS_TOKEN ;

      # ── Step 9 · Upload SBOM to DependencyTrack ──────────────────────────────
      # Disabled: DependencyTrack instance is hibernated (replicaCount: 0).
      # Re-enable by restoring the DTRACK_API_KEY secret fetch above and
      # uncommenting this step when dependency-track is brought back online.
      # - name: Upload SBOM to DependencyTrack and check policy violations
      #   env:
      #     DTRACK_URL: https://${{ vars.DTRACK_HOSTNAME }}
      #     CF_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      #     CF_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      #   run: .github/scripts/dtrack-upload.sh sbom.cdx.json "${{ env.APP_NAME }}" "${{ github.sha }}"

      # ── Step 10 · Sign image digest with Cosign (AWS KMS) ────────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image digest
        run: |
          cosign sign --yes \
            --key awskms:///alias/extreme-lab-dev-cosign \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ steps.resolve-digest.outputs.digest }}"

      # ── Step 11 · Attest SBOM with Cosign (AWS KMS) ──────────────────────────
      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --key awskms:///alias/extreme-lab-dev-cosign \
            --type cyclonedx \
            --predicate sbom.cdx.json \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ steps.resolve-digest.outputs.digest }}"

      # ── GitHub-native SLSA build provenance (keyless via Sigstore) ───────────
      # Complements the Cosign/KMS signature above with verifiable provenance
      # tying this image digest to this workflow + commit. Free on public repos.
      # Verify later with: gh attestation verify oci://<image>@<digest> --owner Miracle-1331
      - name: Attest build provenance
        if: needs.check-image.outputs.exists == 'false'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          subject-digest: ${{ steps.resolve-digest.outputs.digest }}
          push-to-registry: false

      # ── Checkout GitOps repo (to update the dev image values) ────────────────
      # NOTE: the old release-metadata ConfigMap ledger (dev.validated=true …)
      # has been removed. The promotion gate is now a signed attestation chain,
      # not a mutable file in git: see `attest-dev-approval` below, and the
      # `verify-chain` jobs in promote-qa / promote-prod.
      - name: Checkout GitOps repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ env.GITOPS_TOKEN }}
          path: _gitops

      # ── Update dev values in GitOps repo ─────────────────────────────────────
      - name: Install yq
        run: |
          curl -sSL \
            "https://github.com/mikefarah/yq/releases/download/${{ env.YQ_VERSION }}/yq_linux_amd64" \
            -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq

      - name: Update dev values in GitOps repo
        run: |
          DIGEST="${{ steps.resolve-digest.outputs.digest }}"
          GITOPS_VALUES_FILE="gitops/workloads/todo-app/dev/values.yaml"
          cd _gitops
          test -f "$GITOPS_VALUES_FILE"
          yq -i ".image.digest = \"${DIGEST}\"" "$GITOPS_VALUES_FILE"
          yq -i ".image.tag = \"${{ github.sha }}\"" "$GITOPS_VALUES_FILE"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$GITOPS_VALUES_FILE"
          git diff --staged --quiet || git commit -m "chore: promote ${{ env.APP_NAME }} @ ${{ github.sha }} to dev"
          git push

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 14 · Argo CD sync dev
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-dev:
    name: "14 · Deploy Dev Candidate"
    runs-on: ubuntu-latest
    needs: release
    environment: dev
    timeout-minutes: 15
    permissions:
      id-token: write
    outputs:
      gated: ${{ steps.wait-candidate.outputs.gated }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Install Argo CD CLI
        run: |
          curl -fsSL \
            "https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64" \
            -o /usr/local/bin/argocd
          chmod +x /usr/local/bin/argocd

      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: gha-agent-ci
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/argocd/ci-token token | ARGOCD_TOKEN ;

      - name: Sync dev application
        run: |
          set -euo pipefail
          argocd app sync todo-app-dev \
            --server "${{ vars.ARGOCD_SERVER }}" \
            --auth-token "${ARGOCD_TOKEN}" \
            --grpc-web \
            --header "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            --header "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            --prune \
            --timeout 300

      - name: Wait for canary CI gate
        id: wait-candidate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            APP_JSON="$(
              argocd app get todo-app-dev \
                --server "${{ vars.ARGOCD_SERVER }}" \
                --auth-token "${ARGOCD_TOKEN}" \
                --grpc-web \
                --header "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
                --header "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
                --refresh \
                -o json
            )"
            SYNC_STATUS="$(jq -r '.status.sync.status'   <<< "${APP_JSON}")"
            HEALTH_STATUS="$(jq -r '.status.health.status' <<< "${APP_JSON}")"
            echo "Attempt ${attempt}/90: ${SYNC_STATUS} ${HEALTH_STATUS}"
            # Normal canary flow: canary pods ready, rollout paused at CI gate.
            if [[ "${SYNC_STATUS}" == "Synced" && "${HEALTH_STATUS}" == "Suspended" ]]; then
              echo "gated=true" >> "${GITHUB_OUTPUT}"
              echo "Canary is ready and waiting at the CI gate."
              exit 0
            fi
            # First-time installation: no previous stable, rollout skips canary steps.
            if [[ "${SYNC_STATUS}" == "Synced" && "${HEALTH_STATUS}" == "Healthy" ]]; then
              echo "gated=false" >> "${GITHUB_OUTPUT}"
              echo "Rollout is already healthy; no promotion required."
              exit 0
            fi
            if [[ "${HEALTH_STATUS}" == "Degraded" ]]; then
              echo "Rollout became degraded."
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for the canary gate."
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 16 · OWASP ZAP baseline DAST — scans canary only via X-Canary header
  # ─────────────────────────────────────────────────────────────────────────────
  dast-dev:
    name: "16 · DAST (ZAP baseline) — Dev Canary"
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: dev
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: ZAP baseline scan against canary
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.DEV_APP_URL }}
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-dev-report
          rules_file_name: .zap/rules.tsv
          cmd_options: >-
            -j
            -z "
            -config replacer.full_list(0).description=CF-Access-Client-Id
            -config replacer.full_list(0).enabled=true
            -config replacer.full_list(0).matchtype=REQ_HEADER
            -config replacer.full_list(0).matchstr=CF-Access-Client-Id
            -config replacer.full_list(0).replacement=${{ secrets.CF_ACCESS_CLIENT_ID }}
            -config replacer.full_list(1).description=CF-Access-Client-Secret
            -config replacer.full_list(1).enabled=true
            -config replacer.full_list(1).matchtype=REQ_HEADER
            -config replacer.full_list(1).matchstr=CF-Access-Client-Secret
            -config replacer.full_list(1).replacement=${{ secrets.CF_ACCESS_CLIENT_SECRET }}
            -config replacer.full_list(2).description=Force-Canary
            -config replacer.full_list(2).enabled=true
            -config replacer.full_list(2).matchtype=REQ_HEADER
            -config replacer.full_list(2).matchstr=X-Canary
            -config replacer.full_list(2).replacement=always
            "

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 17 · Resume Rollout after DAST, wait for full progressive delivery
  # ─────────────────────────────────────────────────────────────────────────────
  progress-dev:
    name: "17 · Promote and Validate Dev Rollout"
    runs-on: ubuntu-latest
    needs: [deploy-dev, dast-dev]
    environment: dev
    timeout-minutes: 60
    permissions:
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Install Argo CD CLI
        run: |
          curl -fsSL \
            "https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64" \
            -o /usr/local/bin/argocd
          chmod +x /usr/local/bin/argocd

      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: gha-agent-ci
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/argocd/ci-token token | ARGOCD_TOKEN ;

      - name: Resume Rollout after DAST
        if: needs.deploy-dev.outputs.gated == 'true'
        run: |
          set -euo pipefail
          argocd app actions run todo-app-dev resume \
            --group argoproj.io \
            --kind Rollout \
            --namespace todo-app-dev \
            --resource-name nextjs-todo-app \
            --server "${{ vars.ARGOCD_SERVER }}" \
            --auth-token "${ARGOCD_TOKEN}" \
            --grpc-web \
            --header "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            --header "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}"

      - name: Wait for complete progressive rollout
        shell: bash
        run: |
          set -euo pipefail
          # 5m + 10m + 15m pauses plus inline analysis time — allow up to 60m total.
          for attempt in $(seq 1 360); do
            APP_JSON="$(
              argocd app get todo-app-dev \
                --server "${{ vars.ARGOCD_SERVER }}" \
                --auth-token "${ARGOCD_TOKEN}" \
                --grpc-web \
                --header "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
                --header "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
                --refresh \
                -o json
            )"
            SYNC_STATUS="$(jq -r '.status.sync.status'   <<< "${APP_JSON}")"
            HEALTH_STATUS="$(jq -r '.status.health.status' <<< "${APP_JSON}")"
            echo "Attempt ${attempt}/360: ${SYNC_STATUS} ${HEALTH_STATUS}"
            if [[ "${SYNC_STATUS}" == "Synced" && "${HEALTH_STATUS}" == "Healthy" ]]; then
              echo "Dev rollout completed successfully."
              exit 0
            fi
            if [[ "${HEALTH_STATUS}" == "Degraded" ]]; then
              echo "Rollout failed or an AnalysisRun aborted it."
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for the progressive rollout."
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 18 · Attest dev approval (keyless, GitHub OIDC)
  # Signs a "passed dev" promotion record bound to the image digest, issued by
  # THIS workflow's identity. promote-qa's verify-chain requires this exact
  # attestation before it will promote — replaces the old mutable git ledger.
  # ─────────────────────────────────────────────────────────────────────────────
  attest-dev-approval:
    name: "18 · Attest Dev Approval"
    runs-on: ubuntu-latest
    needs: [release, progress-dev]
    timeout-minutes: 10
    permissions:
      id-token: write # keyless signing via Fulcio
      attestations: write # write to the GitHub attestation store
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Build dev-approval predicate
        id: predicate
        run: |
          set -euo pipefail
          DIGEST="${{ needs.release.outputs.image-digest }}"
          cat > approval.json <<EOF
          {
            "environment": "dev",
            "image": "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}",
            "digest": "${DIGEST}",
            "tag": "${{ github.sha }}",
            "commit": "${{ github.sha }}",
            "source_repo": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "validated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "evidence": { "dev_rollout": "healthy", "dast_baseline": "passed" }
          }
          EOF
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign dev-approval attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          subject-digest: ${{ steps.predicate.outputs.digest }}
          predicate-type: https://extreme-lab.dev/promotion/dev/v1
          predicate-path: approval.json
          push-to-registry: false
