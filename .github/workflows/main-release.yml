name: Main Release

# Stage 2 — Merge to main.
# Builds the official release candidate artifact once.
# Scans once, signs once, deploys to dev, runs DAST.
# Does NOT trigger on PRs — only on commits landing on main.

on:
  push:
    branches: [main]

concurrency:
  group: main-release-nextjs-todo-app
  cancel-in-progress: false # never cancel a release in flight

env:
  NODE_VERSION: "24"
  IMAGE_NAME: nextjs-todo-app
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }} # e.g. 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }} # e.g. extreme-lab/todo-app
  GITOPS_REPO: ${{ vars.GITOPS_REPO }} # e.g. org/gitops-repo
  APP_NAME: nextjs-todo-app
  VAULT_URL: https://vault.merveilles.org
  VAULT_AUTH_PATH: github-actions
  YQ_VERSION: "v4.44.3"
  ARGOCD_VERSION: "v2.13.3"

permissions: {}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Steps 1-13 · Build · Scan · SBOM · Sign · GitOps update
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: "Build · Scan · Sign · GitOps"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      security-events: write
    outputs:
      image-digest: ${{ steps.resolve-digest.outputs.digest }}
    steps:
      # ── Step 1 ────────────────────────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── Step 2 ────────────────────────────────────────────────────────────────
      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Step 3 ────────────────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ── Step 4 ────────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Step 5 · Check if tag already exists (immutable tags block re-push) ────
      - name: Check if image tag already exists in ECR
        id: check-image
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --image-ids imageTag="${{ github.sha }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || echo "")
          if [ -n "$DIGEST" ] && [ "$DIGEST" != "None" ]; then
            echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "Image tag already exists in ECR: ${DIGEST} — skipping build"
          else
            echo "Image tag not found — will build and push"
          fi

      # ── Step 6 · Build and push (skipped if tag already exists) ──────────────
      - name: Build and push image
        id: build
        if: steps.check-image.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Resolve image digest
        id: resolve-digest
        run: |
          DIGEST="${{ steps.build.outputs.digest }}${{ steps.check-image.outputs.digest }}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Resolved digest: ${DIGEST}"

      # ── Step 7 · Scan the pushed image by its immutable digest ───────────────
      - name: Trivy — image scan by digest (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ steps.resolve-digest.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true

      - name: Upload image scan SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        continue-on-error: true # requires GitHub Advanced Security — skip gracefully if not enabled
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-main

      # ── Step 8 · Generate SBOM (CycloneDX) ───────────────────────────────────
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ steps.resolve-digest.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      # ── Fetch release secrets from Vault (covers steps 9, 11, 12) ────────────
      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: gha-agent-ci
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/dependency-track/ci-token token | DTRACK_API_KEY ;
            kv/data/platform/github/gitops-token token | GITOPS_TOKEN ;

      # ── Step 9 · Upload SBOM to DependencyTrack ──────────────────────────────
      - name: Upload SBOM to DependencyTrack and check policy violations
        env:
          DTRACK_URL: https://${{ vars.DTRACK_HOSTNAME }}
        run: |
          BOM_B64=$(base64 -w 0 sbom.cdx.json)
          RESPONSE=$(curl -sf --retry 3 \
            -H "X-Api-Key: ${DTRACK_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"projectName\": \"${{ env.APP_NAME }}\",
              \"projectVersion\": \"${{ github.sha }}\",
              \"autoCreate\": true,
              \"bom\": \"${BOM_B64}\"
            }" \
            "${DTRACK_URL}/api/v1/bom")
          TOKEN=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          echo "DependencyTrack BOM token: ${TOKEN}"

          COMPLETED=false
          for i in $(seq 1 30); do
            PROCESSING=$(curl -sf \
              -H "X-Api-Key: ${DTRACK_API_KEY}" \
              "${DTRACK_URL}/api/v1/bom/token/${TOKEN}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['processing'])")
            if [ "$PROCESSING" = "False" ]; then
              COMPLETED=true
              break
            fi
            sleep 10
          done

          if [ "$COMPLETED" != "true" ]; then
            echo "Dependency-Track BOM processing timed out"
            exit 1
          fi

          curl -sf \
            -H "X-Api-Key: ${DTRACK_API_KEY}" \
            "${DTRACK_URL}/api/v1/violation/project?name=${{ env.APP_NAME }}&version=${{ github.sha }}" \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          critical = [v for v in data if v.get('type') == 'SECURITY']
          if critical:
              print(f'Policy violations: {len(critical)}')
              sys.exit(1)
          print('No critical policy violations.')
          "

      # ── Step 10 · Sign image digest with Cosign (AWS KMS) ────────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest
        run: |
          cosign sign --yes \
            --key awskms:///alias/extreme-lab-dev-cosign \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ steps.resolve-digest.outputs.digest }}"

      # ── Step 11 · Attest SBOM with Cosign (AWS KMS) ──────────────────────────
      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --key awskms:///alias/extreme-lab-dev-cosign \
            --type cyclonedx \
            --predicate sbom.cdx.json \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ steps.resolve-digest.outputs.digest }}"

      # ── Step 12 · Write release metadata to GitOps repo ──────────────────────
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ env.GITOPS_TOKEN }}
          path: _gitops

      - name: Write release metadata
        run: |
          DIGEST="${{ steps.resolve-digest.outputs.digest }}"
          SAFE_DIGEST="${DIGEST//:/-}"
          META_FILE="_gitops/releases/${{ env.APP_NAME }}/${SAFE_DIGEST}.yaml"
          mkdir -p "_gitops/releases/${{ env.APP_NAME }}"
          cat > "$META_FILE" <<EOF
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: release-${{ env.APP_NAME }}-${SAFE_DIGEST}
            labels:
              app: ${{ env.APP_NAME }}
          data:
            commit: "${{ github.sha }}"
            digest: "${DIGEST}"
            source_repo: "${{ github.repository }}"
            pipeline_run: "${{ github.run_id }}"
            built_at: "${{ github.event.head_commit.timestamp }}"
            dev.deployed: "false"
            dev.validated: "false"
            qa.deployed: "false"
            qa.validated: "false"
            prod.deployed: "false"
            prod.validated: "false"
          EOF
          cd _gitops
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          git commit -m "chore: release metadata for ${{ env.APP_NAME }} @ ${{ github.sha }}"
          git push

      # ── Step 13 · Update dev values in GitOps repo ───────────────────────────
      - name: Install yq
        run: |
          curl -sSL \
            "https://github.com/mikefarah/yq/releases/download/${{ env.YQ_VERSION }}/yq_linux_amd64" \
            -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq

      - name: Update dev values in GitOps repo
        run: |
          DIGEST="${{ steps.resolve-digest.outputs.digest }}"
          GITOPS_VALUES_FILE="gitops/workloads/todo-app/dev/values.yaml"
          cd _gitops
          test -f "$GITOPS_VALUES_FILE"
          yq -i ".image.digest = \"${DIGEST}\"" "$GITOPS_VALUES_FILE"
          yq -i ".image.tag = \"${{ github.sha }}\"" "$GITOPS_VALUES_FILE"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$GITOPS_VALUES_FILE"
          git diff --staged --quiet || git commit -m "chore: promote ${{ env.APP_NAME }} @ ${{ github.sha }} to dev"
          git push

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 14 · Argo CD sync dev
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-dev:
    name: "14 · Deploy Dev"
    runs-on: ubuntu-latest
    needs: release
    environment: dev
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - name: Install Argo CD CLI
        run: |
          curl -sSL \
            "https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64" \
            -o /usr/local/bin/argocd && chmod +x /usr/local/bin/argocd

      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: gha-agent-ci
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/argocd/ci-token token | ARGOCD_TOKEN ;

      - name: Sync dev application
        run: |
          argocd app sync todo-app-dev \
            --server "${{ vars.ARGOCD_SERVER }}" \
            --auth-token "${{ env.ARGOCD_TOKEN }}" \
            --grpc-web \
            --prune --timeout 300

      - name: Wait for dev rollout healthy
        run: |
          argocd app wait todo-app-dev \
            --server "${{ vars.ARGOCD_SERVER }}" \
            --auth-token "${{ env.ARGOCD_TOKEN }}" \
            --grpc-web \
            --sync --health --operation --timeout 600

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 15 · Mark dev deployed (Argo CD health confirmed — before DAST)
  # ─────────────────────────────────────────────────────────────────────────────
  mark-dev-deployed:
    name: "15 · Mark Dev Deployed"
    runs-on: ubuntu-latest
    needs: [release, deploy-dev]
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: gha-agent-ci
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/github/gitops-token token | GITOPS_TOKEN ;

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ env.GITOPS_TOKEN }}
          path: _gitops

      - name: Install yq
        run: |
          curl -sSL \
            "https://github.com/mikefarah/yq/releases/download/${{ env.YQ_VERSION }}/yq_linux_amd64" \
            -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq

      - name: Set dev.deployed=true
        run: |
          DIGEST="${{ needs.release.outputs.image-digest }}"
          SAFE_DIGEST="${DIGEST//:/-}"
          META_FILE="_gitops/releases/${{ env.APP_NAME }}/${SAFE_DIGEST}.yaml"
          test -f "$META_FILE"
          yq -i '.data["dev.deployed"] = "true"' "$META_FILE"
          cd _gitops
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "releases/${{ env.APP_NAME }}/${SAFE_DIGEST}.yaml"
          git commit -m "chore: mark dev.deployed=true for ${{ env.APP_NAME }} @ ${{ github.sha }}"
          git push

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 16 · OWASP ZAP baseline DAST against dev endpoint
  # ─────────────────────────────────────────────────────────────────────────────
  dast-dev:
    name: "16 · DAST (ZAP baseline) — Dev"
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: dev
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.DEV_APP_URL }}
          fail_action: true
          rules_file_name: .zap/rules.tsv
          cmd_options: "-j"

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dev-report
          path: report_html.html
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 17 · Mark dev validated (DAST passed)
  # ─────────────────────────────────────────────────────────────────────────────
  mark-dev-validated:
    name: "17 · Mark Dev Validated"
    runs-on: ubuntu-latest
    needs: [release, dast-dev]
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: gha-agent-ci
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/github/gitops-token token | GITOPS_TOKEN ;

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ env.GITOPS_TOKEN }}
          path: _gitops

      - name: Install yq
        run: |
          curl -sSL \
            "https://github.com/mikefarah/yq/releases/download/${{ env.YQ_VERSION }}/yq_linux_amd64" \
            -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq

      - name: Set dev.validated=true
        run: |
          DIGEST="${{ needs.release.outputs.image-digest }}"
          SAFE_DIGEST="${DIGEST//:/-}"
          META_FILE="_gitops/releases/${{ env.APP_NAME }}/${SAFE_DIGEST}.yaml"
          test -f "$META_FILE"
          yq -i '.data["dev.validated"] = "true"' "$META_FILE"
          cd _gitops
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "releases/${{ env.APP_NAME }}/${SAFE_DIGEST}.yaml"
          git commit -m "chore: mark dev.validated=true for ${{ env.APP_NAME }} @ ${{ github.sha }}"
          git push
