name: Main Release

# Stage 2 — Merge to main.
# Builds the official release candidate artifact once.
# Scans once, signs once, deploys to dev, runs DAST.
# Does NOT trigger on PRs — only on commits landing on main.

on:
  workflow_dispatch:   # temporarily disabled — re-enable by restoring: push: branches: [main]

concurrency:
  group: main-release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release in flight

env:
  NODE_VERSION: "24"
  IMAGE_NAME: nextjs-todo-app
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}      # e.g. 123456789012.dkr.ecr.ap-northeast-1.amazonaws.com
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}  # e.g. nextjs-todo-app
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}         # e.g. org/gitops-repo
  APP_NAME: nextjs-todo-app
  VAULT_URL: https://vault.merveilles.org
  VAULT_AUTH_PATH: github-actions
  VAULT_ROLE: gha-agent-ci

permissions:
  id-token: write   # GitHub OIDC → AWS STS + Vault JWT auth
  contents: write   # push release metadata to GitOps repo
  security-events: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Step 1-2 · Checkout + AWS OIDC auth
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: "Build · Scan · Sign · Deploy Dev"
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.resolve-digest.outputs.digest }}
    steps:
      # ── Step 1 ────────────────────────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── Step 2 ────────────────────────────────────────────────────────────────
      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Step 3 ────────────────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ── Step 4 ────────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (local, pre-scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Step 5 · Local image scan — fail on HIGH/CRITICAL before pushing ────
      - name: Trivy — local image scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-image-local.sarif
          ignore-unfixed: true

      - name: Upload local image scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-local.sarif
          category: trivy-image-main

      # ── Step 6 · Push image ──────────────────────────────────────────────────
      - name: Push image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha

      # ── Step 7 · Resolve immutable digest ────────────────────────────────────
      - name: Resolve image digest from ECR
        id: resolve-digest
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --image-ids imageTag="${{ github.sha }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Image digest: ${DIGEST}"

      # ── Step 8 · Remote scan by digest ───────────────────────────────────────
      - name: Trivy — remote image scan by digest
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ steps.resolve-digest.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-image-remote.sarif
          ignore-unfixed: true

      - name: Upload remote image scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-remote.sarif
          category: trivy-image-remote

      # ── Step 9 · Generate SBOM (CycloneDX) ───────────────────────────────────
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ steps.resolve-digest.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      # ── Get CI tokens from Vault (covers steps 10, 13, 14) ───────────────────
      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/dependency-track/ci-token token | DTRACK_API_KEY ;
            kv/data/platform/github/gitops-token token | GITOPS_TOKEN ;

      # ── Step 10 · Upload SBOM to DependencyTrack ─────────────────────────────
      - name: Upload SBOM to DependencyTrack
        env:
          DTRACK_URL: ${{ vars.DTRACK_URL }}
        run: |
          BOM_B64=$(base64 -w 0 sbom.cdx.json)
          RESPONSE=$(curl -sf --retry 3 \
            -H "X-Api-Key: ${DTRACK_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"projectName\": \"${{ env.APP_NAME }}\",
              \"projectVersion\": \"${{ github.sha }}\",
              \"autoCreate\": true,
              \"bom\": \"${BOM_B64}\"
            }" \
            "${DTRACK_URL}/api/v1/bom")
          TOKEN=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          echo "DependencyTrack BOM token: $TOKEN"

          # Poll until processing completes
          for i in $(seq 1 30); do
            PROCESSING=$(curl -sf \
              -H "X-Api-Key: ${DTRACK_API_KEY}" \
              "${DTRACK_URL}/api/v1/bom/token/${TOKEN}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['processing'])")
            if [ "$PROCESSING" = "False" ]; then break; fi
            sleep 10
          done

          # Check policy violations
          VIOLATIONS=$(curl -sf \
            -H "X-Api-Key: ${DTRACK_API_KEY}" \
            "${DTRACK_URL}/api/v1/violation/project?name=${{ env.APP_NAME }}&version=${{ github.sha }}" \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          critical = [v for v in data if v.get('type') == 'SECURITY']
          if critical:
              print(f'Policy violations: {len(critical)}')
              sys.exit(1)
          print('No critical policy violations.')
          ")
          echo "$VIOLATIONS"

      # ── Step 11 · Sign image digest with Cosign (AWS KMS) ────────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest
        run: |
          cosign sign --yes \
            --key awskms:///alias/extreme-lab-dev-cosign \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ steps.resolve-digest.outputs.digest }}"

      # ── Step 12 · Attest SBOM with Cosign (AWS KMS) ──────────────────────────
      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --key awskms:///alias/extreme-lab-dev-cosign \
            --type cyclonedx \
            --predicate sbom.cdx.json \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ steps.resolve-digest.outputs.digest }}"

      # ── Step 13 · Write release metadata to GitOps repo ──────────────────────
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ env.GITOPS_TOKEN }}
          path: gitops

      - name: Write release metadata
        run: |
          DIGEST="${{ steps.resolve-digest.outputs.digest }}"
          SAFE_DIGEST="${DIGEST//:/-}"
          META_FILE="gitops/releases/${{ env.APP_NAME }}/${SAFE_DIGEST}.yaml"
          mkdir -p "$(dirname "$META_FILE")"
          cat > "$META_FILE" <<EOF
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: release-${{ env.APP_NAME }}-${SAFE_DIGEST}
            labels:
              app: ${{ env.APP_NAME }}
          data:
            commit: "${{ github.sha }}"
            digest: "${DIGEST}"
            source_repo: "${{ github.repository }}"
            pipeline_run: "${{ github.run_id }}"
            built_at: "${{ github.event.head_commit.timestamp }}"
            dev.deployed: "false"
            dev.validated: "false"
            qa.deployed: "false"
            qa.validated: "false"
            prod.deployed: "false"
            prod.validated: "false"
          EOF
          cd gitops
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          git commit -m "chore: release metadata for ${{ env.APP_NAME }} @ ${{ github.sha }}"
          git push

      # ── Step 14 · Update dev values in GitOps repo ───────────────────────────
      - name: Install yq
        run: |
          curl -sSL \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq

      - name: Update values/dev.yaml with new digest
        run: |
          DIGEST="${{ steps.resolve-digest.outputs.digest }}"
          cd gitops
          yq -i ".image.digest = \"${DIGEST}\"" "workloads/todo-app/dev/values.yaml"
          yq -i ".image.tag = \"${{ github.sha }}\"" "workloads/todo-app/dev/values.yaml"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "workloads/todo-app/dev/values.yaml"
          git diff --staged --quiet || git commit -m "chore: promote ${{ env.APP_NAME }} ${{ github.sha }} to dev"
          git push

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 15-16 · Argo CD sync dev + canary rollout
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-dev:
    name: "15-16 · Deploy Dev + Canary"
    runs-on: ubuntu-latest
    needs: release
    environment: dev
    steps:
      - name: Install Argo CD CLI
        run: |
          curl -sSL \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64 \
            -o /usr/local/bin/argocd && chmod +x /usr/local/bin/argocd

      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/argocd/ci-token token | ARGOCD_TOKEN ;

      - name: Argo CD login
        run: |
          argocd login "${{ vars.ARGOCD_SERVER }}" \
            --auth-token "${{ env.ARGOCD_TOKEN }}" \
            --grpc-web

      - name: Sync dev application
        run: |
          argocd app sync "${{ env.APP_NAME }}-dev" \
            --force --prune --timeout 300

      - name: Wait for dev rollout healthy
        run: |
          argocd app wait "${{ env.APP_NAME }}-dev" \
            --health --timeout 300

      # TODO: uncomment when Helm chart supports Argo Rollouts
      # - name: Wait for Argo Rollouts canary to complete
      #   run: |
      #     kubectl --server "${{ vars.DEV_KUBE_SERVER }}" \
      #             --token  "${{ env.DEV_KUBE_TOKEN }}" \
      #       argo rollouts status "${{ env.APP_NAME }}" \
      #         --namespace dev --timeout 600

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 17 · OWASP ZAP baseline DAST against dev endpoint
  # ─────────────────────────────────────────────────────────────────────────────
  dast-dev:
    name: "17 · DAST (ZAP baseline) — Dev"
    runs-on: ubuntu-latest
    needs: deploy-dev
    permissions:
      security-events: write
    steps:
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.DEV_APP_URL }}
          fail_action: true
          rules_file_name: .zap/rules.tsv
          cmd_options: "-j"

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dev-report
          path: report_html.html
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 18 · Mark dev validated in release metadata
  # ─────────────────────────────────────────────────────────────────────────────
  mark-dev-validated:
    name: "18 · Mark Dev Validated"
    runs-on: ubuntu-latest
    needs: [release, dast-dev]
    steps:
      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/github/gitops-token token | GITOPS_TOKEN ;

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ env.GITOPS_TOKEN }}
          path: gitops

      - name: Install yq
        run: |
          curl -sSL \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq

      - name: Set dev.deployed=true and dev.validated=true
        run: |
          DIGEST="${{ needs.release.outputs.image-digest }}"
          SAFE_DIGEST="${DIGEST//:/-}"
          META_FILE="gitops/releases/${{ env.APP_NAME }}/${SAFE_DIGEST}.yaml"
          yq -i '.data["dev.deployed"] = "true"' "$META_FILE"
          yq -i '.data["dev.validated"] = "true"' "$META_FILE"
          cd gitops
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "releases/${{ env.APP_NAME }}/${SAFE_DIGEST}.yaml"
          git commit -m "chore: mark dev.validated=true for ${{ env.APP_NAME }} @ ${{ github.sha }}"
          git push
