name: PR Validation

# Stage 1 — Validate code before merge.
# Triggered on any PR targeting main (feature/*, bugfix/*, hotfix/*).
# Does NOT build official artifacts or deploy.
#
# Path-aware: a `changes` detect job classifies the diff into groups
# (app / tests / ci) and the heavy jobs run only when their group changed.
# The `PR Validated` gate ALWAYS runs and reports, so it stays valid as a
# required status check even on docs-only PRs (skipped jobs count as passing).

# Public repo → GitHub-hosted runner minutes are free, so validate every PR.
on:
  pull_request:
    branches: [main]
concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  IMAGE_NAME: nextjs-todo-app
  SONAR_HOST_URL: https://sonarqube.merveilles.org
  VAULT_URL: https://vault.merveilles.org
  VAULT_AUTH_PATH: github-actions
  VAULT_ROLE: gha-agent-ci

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Detect which groups of files changed. Downstream jobs gate on these outputs
  # so a docs-only or workflow-only PR doesn't run the full test/build/scan suite.
  #   app   → source/build inputs that affect the image or app behaviour
  #   tests → test suites and their configs
  #   ci    → workflow / automation config
  # ─────────────────────────────────────────────────────────────────────────────
  changes:
    name: "Detect changed paths"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      tests: ${{ steps.filter.outputs.tests }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            app:
              - 'src/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - '.dockerignore'
              - 'next.config.ts'
              - 'tsconfig.json'
              - 'migrations/**'
            tests:
              - 'e2e/**'
              - 'jest.config.ts'
              - 'playwright.config.ts'
              - 'eslint.config.mjs'
            ci:
              - '.github/workflows/**'
              - '.github/dependabot.yml'

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 0 — Lint all workflow files (actionlint). Runs only when CI config changed.
  # Catches invalid action refs, bad expressions, type errors before anything runs.
  # ─────────────────────────────────────────────────────────────────────────────
  actionlint:
    name: "0 · Lint Workflows"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1
        with:
          fail_on_error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 1-5 — Checkout · Runtime · Install · Unit tests + coverage · Lint
  # Runs when app source or test suites changed.
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: "1-5 · Unit Tests & Lint"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.tests == 'true'
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests with coverage
        run: npm run test:coverage -- --ci

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Run ESLint
        run: npm run lint

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 6 — SonarQube scan + Quality Gate
  # Token sourced from Vault (kv/data/platform/sonarqube/ci-token)
  # ─────────────────────────────────────────────────────────────────────────────
  sonar:
    name: "6 · SonarQube Quality Gate"
    # Disabled by default. Enable by setting repo variable ENABLE_SONAR=true.
    # Runs only when app/test files changed (its condition is a subset of `test`'s,
    # so whenever it runs, the `test` job it depends on ran and succeeded too).
    if: ${{ vars.ENABLE_SONAR == 'true' && (needs.changes.outputs.app == 'true' || needs.changes.outputs.tests == 'true') }}
    runs-on: ubuntu-latest
    needs: [changes, test]
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for Vault JWT auth
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-report
          path: coverage/

      - name: Setup Java (SonarScanner requirement)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/sonarqube/ci-token token | SONAR_TOKEN ;

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496 # v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 7 — Trivy FS scan: secrets · dep vulns · IaC misconfigs
  # Runs when app OR ci config changed (covers Dockerfile, IaC and workflow files).
  # Blocking: fails on HIGH/CRITICAL or any secret.
  # ─────────────────────────────────────────────────────────────────────────────
  trivy-fs:
    name: "7 · Trivy FS Scan"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.ci == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning (free on public repos)
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Blocking scan — table format, exits 1 on HIGH/CRITICAL findings
      - name: Trivy — secrets, vulns, misconfig (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          ignore-unfixed: true

      # Report scan — SARIF format for artifact upload, never blocks
      - name: Trivy — generate SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true

      - name: Upload Trivy SARIF to code scanning
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload Trivy report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-fs-report
          path: trivy-fs.sarif
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 8 — Docker build check + Trivy image scan
  # Runs only when app source changed. Confirms the Dockerfile builds and the
  # resulting image is clean. Does NOT push — local image only.
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build-check:
    name: "8 · Docker Build Check"
    runs-on: ubuntu-latest
    needs: [changes, test, trivy-fs]
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image (local only, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 9 — Dependency Review: block PRs that introduce vulnerable or
  # disallowed-license dependencies. Native to GitHub, free on public repos.
  # Requires the dependency graph to be enabled on the repo.
  # Always runs on PRs — trivially fast when no manifest changed.
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-review:
    name: "9 · Dependency Review"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Block copyleft licenses that are incompatible with MIT distribution.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  # ─────────────────────────────────────────────────────────────────────────────
  # Summary gate — configure as a required status check in branch protection.
  # Always runs so the required check reports on every PR (skipped jobs pass).
  # ─────────────────────────────────────────────────────────────────────────────
  pr-validated:
    name: PR Validated
    runs-on: ubuntu-latest
    needs:
      [actionlint, test, sonar, trivy-fs, docker-build-check, dependency-review]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          failed = [k for k, v in needs.items() if v['result'] not in ('success', 'skipped')]
          if failed:
              print('FAILED jobs:', ', '.join(failed))
              sys.exit(1)
          print('All required jobs passed.')
          "
