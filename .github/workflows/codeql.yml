name: CodeQL

# Native GitHub SAST for JavaScript/TypeScript. Free for public repos.
# Results appear under Security ▸ Code scanning and can gate PRs.

on:
  push:
    branches: [main]
    # Only analyse when JS/TS source (or its dependencies) changes.
    paths: &code-paths
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths: *code-paths
  schedule:
    # Weekly full scan (Mondays 06:17 UTC) to catch newly published CVE rules,
    # regardless of what changed — this is the safety net for the path filter.
    - cron: "17 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload results to code scanning
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          languages: ${{ matrix.language }}
          # "security-and-quality" is broader than the default "security" suite.
          queries: security-and-quality

      # Next.js/TS needs no compilation for CodeQL — autobuild is a no-op but
      # kept for correctness if a build step is added later.
      - name: Autobuild
        uses: github/codeql-action/autobuild@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          category: "/language:${{ matrix.language }}"
