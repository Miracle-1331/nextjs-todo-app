name: Promote to QA

# Stage 3 — Manual promotion of a dev-validated image digest to QA.
# Does NOT rebuild. Validates dev gate before promoting.
# Runs deeper E2E, smoke, and optional DAST.
# TEMPORARILY DISABLED — workflow_dispatch only (manual trigger required).

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Image digest to promote (e.g. sha256:abc123…)"
        required: true
        type: string

env:
  APP_NAME: nextjs-todo-app
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  AWS_REGION: ap-northeast-1
  VAULT_URL: https://vault.merveilles.org
  VAULT_AUTH_PATH: github-actions
  VAULT_ROLE: gha-agent-ci

permissions:
  id-token: write
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Step 1-2 · Input validation + optional human approval gate
  # ─────────────────────────────────────────────────────────────────────────────
  validate-inputs:
    name: "1-2 · Validate Inputs & Approval"
    runs-on: ubuntu-latest
    environment: qa   # GitHub Environment "qa" may enforce required reviewers
    steps:
      - name: Validate digest format
        run: |
          DIGEST="${{ inputs.image_digest }}"
          if ! echo "$DIGEST" | grep -qE '^sha256:[a-f0-9]{64}$'; then
            echo "ERROR: image_digest must match sha256:<64-hex-chars>"
            exit 1
          fi
          echo "Digest format OK: $DIGEST"

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 3-6 · Checkout GitOps + validate release metadata gates
  # ─────────────────────────────────────────────────────────────────────────────
  validate-gates:
    name: "3-6 · Validate Dev Gates"
    runs-on: ubuntu-latest
    needs: validate-inputs
    steps:
      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/github/gitops-token token | GITOPS_TOKEN ;

      - name: Checkout GitOps repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ env.GITOPS_TOKEN }}

      - name: Install yq
        run: |
          curl -sSL \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq

      - name: Step 4 — Release metadata exists
        run: |
          DIGEST="${{ inputs.image_digest }}"
          SAFE_DIGEST="${DIGEST//:/-}"
          META_FILE="releases/${{ env.APP_NAME }}/${SAFE_DIGEST}.yaml"
          if [ ! -f "$META_FILE" ]; then
            echo "ERROR: No release metadata for digest ${DIGEST}"
            echo "This digest was not produced by the official pipeline."
            exit 1
          fi
          echo "Release metadata found: $META_FILE"

      - name: Step 5 — dev.deployed=true
        run: |
          DIGEST="${{ inputs.image_digest }}"
          SAFE_DIGEST="${DIGEST//:/-}"
          META_FILE="releases/${{ env.APP_NAME }}/${SAFE_DIGEST}.yaml"
          DEV_DEPLOYED=$(yq '.data["dev.deployed"]' "$META_FILE")
          if [ "$DEV_DEPLOYED" != "true" ]; then
            echo "ERROR: dev.deployed is '${DEV_DEPLOYED}' — digest was not deployed to dev."
            exit 1
          fi
          echo "dev.deployed=true ✓"

      - name: Step 6 — dev.validated=true
        run: |
          DIGEST="${{ inputs.image_digest }}"
          SAFE_DIGEST="${DIGEST//:/-}"
          META_FILE="releases/${{ env.APP_NAME }}/${SAFE_DIGEST}.yaml"
          DEV_VALIDATED=$(yq '.data["dev.validated"]' "$META_FILE")
          if [ "$DEV_VALIDATED" != "true" ]; then
            echo "ERROR: dev.validated is '${DEV_VALIDATED}' — dev tests did not pass."
            exit 1
          fi
          echo "dev.validated=true ✓"

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 7-8 · Update QA values + create GitOps PR
  # ─────────────────────────────────────────────────────────────────────────────
  update-qa-values:
    name: "7-8 · Update QA Values"
    runs-on: ubuntu-latest
    needs: validate-gates
    steps:
      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/github/gitops-token token | GITOPS_TOKEN ;

      - name: Checkout GitOps repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ env.GITOPS_TOKEN }}

      - name: Install yq
        run: |
          curl -sSL \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq

      - name: Step 7 — Update values/qa.yaml with promoted digest
        run: |
          DIGEST="${{ inputs.image_digest }}"
          COMMIT=$(yq ".data.commit" "releases/${{ env.APP_NAME }}/${DIGEST//:/-}.yaml")
          yq -i ".image.digest = \"${DIGEST}\"" "workloads/todo-app/qa/values.yaml"
          yq -i ".image.tag = \"${COMMIT}\"" "workloads/todo-app/qa/values.yaml"

      - name: Step 8 — Create GitOps PR for QA promotion
        run: |
          BRANCH="promote/${{ env.APP_NAME }}/qa/${{ inputs.image_digest }}"
          BRANCH="${BRANCH:0:100}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$BRANCH"
          git add "workloads/todo-app/qa/values.yaml"
          git commit -m "chore: promote ${{ env.APP_NAME }} to qa @ ${{ inputs.image_digest }}"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --repo "${{ env.GITOPS_REPO }}" \
            --title "Promote ${{ env.APP_NAME }} to QA" \
            --body "Promoting digest \`${{ inputs.image_digest }}\` to QA.
          Triggered by: ${{ github.actor }}
          Pipeline run: ${{ github.run_id }}" \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ env.GITOPS_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 9-10 · Argo CD sync QA + canary rollout
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-qa:
    name: "9-10 · Deploy QA + Canary"
    runs-on: ubuntu-latest
    needs: update-qa-values
    environment: qa
    steps:
      - name: Install Argo CD CLI
        run: |
          curl -sSL \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64 \
            -o /usr/local/bin/argocd && chmod +x /usr/local/bin/argocd

      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/argocd/ci-token token | ARGOCD_TOKEN ;

      - name: Argo CD login
        run: |
          argocd login "${{ vars.ARGOCD_SERVER }}" \
            --auth-token "${{ env.ARGOCD_TOKEN }}" \
            --grpc-web

      - name: Sync QA application
        run: |
          argocd app sync "${{ env.APP_NAME }}-qa" \
            --force --prune --timeout 300

      - name: Wait for QA rollout healthy
        run: |
          argocd app wait "${{ env.APP_NAME }}-qa" \
            --health --timeout 300

      # TODO: uncomment when Helm chart supports Argo Rollouts
      # - name: Wait for Argo Rollouts canary to complete
      #   run: |
      #     kubectl --server "${{ vars.QA_KUBE_SERVER }}" \
      #             --token  "${{ env.QA_KUBE_TOKEN }}" \
      #       argo rollouts status "${{ env.APP_NAME }}" \
      #         --namespace qa --timeout 600

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 11 · E2E tests (Playwright) against QA
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-qa:
    name: "11 · QA E2E Tests"
    runs-on: ubuntu-latest
    needs: deploy-qa
    env:
      NODE_VERSION: "24"
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against QA
        run: SKIP_DEV_SERVER=1 npm run test:e2e
        env:
          BASE_URL: ${{ vars.QA_APP_URL }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-qa
          path: playwright-report/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 12 · Smoke test (health + core API endpoints)
  # ─────────────────────────────────────────────────────────────────────────────
  smoke-qa:
    name: "12 · Smoke Test — QA"
    runs-on: ubuntu-latest
    needs: deploy-qa
    steps:
      - name: Health check
        run: |
          URL="${{ vars.QA_APP_URL }}"
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${URL}/api/health")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed — HTTP ${STATUS}"
            exit 1
          fi
          echo "Health check passed (HTTP ${STATUS})"

      - name: Core API smoke tests
        run: |
          URL="${{ vars.QA_APP_URL }}"
          curl -sf "${URL}/api/todos" -o /dev/null && echo "GET /api/todos OK"

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 13 · OWASP ZAP full scan against QA (deeper than baseline)
  # ─────────────────────────────────────────────────────────────────────────────
  dast-qa:
    name: "13 · DAST (ZAP full scan) — QA"
    runs-on: ubuntu-latest
    needs: [e2e-qa, smoke-qa]
    permissions:
      security-events: write
    steps:
      - name: ZAP full scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: ${{ vars.QA_APP_URL }}
          fail_action: true
          rules_file_name: .zap/rules.tsv
          cmd_options: "-j"

      - name: Upload ZAP report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zap-qa-report
          path: report_html.html
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 14 · Mark qa.deployed=true and qa.validated=true
  # ─────────────────────────────────────────────────────────────────────────────
  mark-qa-validated:
    name: "14 · Mark QA Validated"
    runs-on: ubuntu-latest
    needs: [e2e-qa, smoke-qa, dast-qa]
    steps:
      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/github/gitops-token token | GITOPS_TOKEN ;

      - name: Checkout GitOps repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ env.GITOPS_TOKEN }}

      - name: Install yq
        run: |
          curl -sSL \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq

      - name: Set qa.deployed=true and qa.validated=true
        run: |
          DIGEST="${{ inputs.image_digest }}"
          SAFE_DIGEST="${DIGEST//:/-}"
          META_FILE="releases/${{ env.APP_NAME }}/${SAFE_DIGEST}.yaml"
          yq -i '.data["qa.deployed"] = "true"' "$META_FILE"
          yq -i '.data["qa.validated"] = "true"' "$META_FILE"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$META_FILE"
          git commit -m "chore: mark qa.validated=true for ${{ env.APP_NAME }} @ ${DIGEST}"
          git push
