name: Promote to QA

# Stage 3 — Manual promotion of a dev-approved image digest to QA.
# Does NOT rebuild. Gate is a SIGNED ATTESTATION CHAIN, not a git file:
# before promoting, verify-chain cryptographically verifies the image
# signature, SBOM, build provenance, AND the dev-approval issued by
# main-release.yml. On success it deploys, runs E2E/smoke/full DAST, then
# signs a qa-approval that promote-prod will require in turn.

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Image digest to promote (e.g. sha256:abc123…)"
        required: true
        type: string

# Serialise QA promotions — never run two at once against the same GitOps state.
concurrency:
  group: promote-qa-nextjs-todo-app
  cancel-in-progress: false

env:
  APP_NAME: nextjs-todo-app
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  AWS_REGION: ap-southeast-1 # must match where main-release builds/pushes
  COSIGN_KEY: awskms:///alias/extreme-lab-dev-cosign
  VAULT_URL: https://vault.merveilles.org
  VAULT_AUTH_PATH: github-actions
  VAULT_ROLE: gha-agent-ci
  YQ_VERSION: "v4.44.3"
  ARGOCD_VERSION: "v2.13.3"

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Step 1-6 · Verify the full signed supply-chain before promoting.
  #   1. digest format
  #   2. image signature   (cosign, KMS key)
  #   3. SBOM attestation  (cosign, KMS key)
  #   4. build provenance  (gh attestation, signed by main-release.yml)
  #   5. dev-approval       (gh attestation, signed by main-release.yml, env=dev)
  # Any failure aborts. Nothing is read from a mutable git file.
  # ─────────────────────────────────────────────────────────────────────────────
  verify-chain:
    name: "1-6 · Verify Signed Promotion Chain"
    runs-on: ubuntu-latest
    environment: qa # GitHub Environment "qa" may enforce required reviewers
    timeout-minutes: 15
    permissions:
      id-token: write # AWS OIDC for ECR/KMS read
      contents: read
      attestations: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Validate digest format
        run: |
          DIGEST="${{ inputs.image_digest }}"
          if ! echo "$DIGEST" | grep -qE '^sha256:[a-f0-9]{64}$'; then
            echo "ERROR: image_digest must match sha256:<64-hex-chars>"
            exit 1
          fi
          echo "Digest format OK: $DIGEST"

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Verify image signature (Cosign / KMS)
        run: |
          cosign verify \
            --key "${{ env.COSIGN_KEY }}" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ inputs.image_digest }}"

      - name: Verify SBOM attestation (Cosign / KMS)
        run: |
          cosign verify-attestation \
            --type cyclonedx \
            --key "${{ env.COSIGN_KEY }}" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ inputs.image_digest }}"

      - name: Verify build provenance (SLSA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify \
            "oci://${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ inputs.image_digest }}" \
            --owner "${{ github.repository_owner }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/main-release.yml" \
            --predicate-type "https://slsa.dev/provenance/v1"

      - name: Verify dev-approval record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Passing requires an attestation of predicate-type .../promotion/dev/v1
          # for THIS digest, signed by main-release.yml. That record only exists
          # if dev fully rolled out and passed DAST. This is the promotion gate.
          gh attestation verify \
            "oci://${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ inputs.image_digest }}" \
            --owner "${{ github.repository_owner }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/main-release.yml" \
            --predicate-type "https://extreme-lab.dev/promotion/dev/v1"

      - name: Resolve promoted tag from ECR
        id: meta
        run: |
          set -euo pipefail
          TAG=$(aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --image-ids imageDigest="${{ inputs.image_digest }}" \
            --query 'imageDetails[0].imageTags[0]' --output text)
          if [ -z "$TAG" ] || [ "$TAG" = "None" ]; then
            echo "ERROR: no tag found in ECR for digest ${{ inputs.image_digest }}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Verified & resolved tag ${TAG} for ${{ inputs.image_digest }}"

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 7-8 · Update QA values + create GitOps PR
  # ─────────────────────────────────────────────────────────────────────────────
  update-qa-values:
    name: "7-8 · Update QA Values"
    runs-on: ubuntu-latest
    needs: verify-chain
    timeout-minutes: 10
    permissions:
      id-token: write # Vault JWT auth
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/github/gitops-token token | GITOPS_TOKEN ;

      - name: Checkout GitOps repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ env.GITOPS_TOKEN }}

      - name: Install yq
        run: |
          curl -sSL \
            "https://github.com/mikefarah/yq/releases/download/${{ env.YQ_VERSION }}/yq_linux_amd64" \
            -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq

      - name: Step 7 — Update values/qa.yaml with verified digest + tag
        run: |
          # Tag/commit come from the VERIFIED chain, not a mutable ledger file.
          COMMIT="${{ needs.verify-chain.outputs.commit }}"
          yq -i ".image.digest = \"${{ inputs.image_digest }}\"" "workloads/todo-app/qa/values.yaml"
          yq -i ".image.tag = \"${COMMIT}\"" "workloads/todo-app/qa/values.yaml"

      - name: Step 8 — Create GitOps PR for QA promotion
        run: |
          BRANCH="promote/${{ env.APP_NAME }}/qa/${{ inputs.image_digest }}"
          BRANCH="${BRANCH:0:100}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$BRANCH"
          git add "workloads/todo-app/qa/values.yaml"
          git commit -m "chore: promote ${{ env.APP_NAME }} to qa @ ${{ inputs.image_digest }}"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --repo "${{ env.GITOPS_REPO }}" \
            --title "Promote ${{ env.APP_NAME }} to QA" \
            --body "Promoting digest \`${{ inputs.image_digest }}\` to QA.
          Triggered by: ${{ github.actor }}
          Pipeline run: ${{ github.run_id }}
          Supply chain verified: signature ✓ SBOM ✓ provenance ✓ dev-approval ✓" \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ env.GITOPS_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 9-10 · Argo CD sync QA + canary rollout
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-qa:
    name: "9-10 · Deploy QA + Canary"
    runs-on: ubuntu-latest
    needs: update-qa-values
    environment: qa
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Install Argo CD CLI
        run: |
          curl -sSL \
            "https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64" \
            -o /usr/local/bin/argocd && chmod +x /usr/local/bin/argocd

      - name: Get CI tokens from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: ${{ env.VAULT_AUTH_PATH }}
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: ${{ env.VAULT_URL }}
          extraHeaders: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            kv/data/platform/argocd/ci-token token | ARGOCD_TOKEN ;

      - name: Argo CD login
        run: |
          argocd login "${{ vars.ARGOCD_SERVER }}" \
            --auth-token "${{ env.ARGOCD_TOKEN }}" \
            --grpc-web

      - name: Sync QA application
        run: |
          argocd app sync "${{ env.APP_NAME }}-qa" \
            --force --prune --timeout 300

      - name: Wait for QA rollout healthy
        run: |
          argocd app wait "${{ env.APP_NAME }}-qa" \
            --health --timeout 300

      # TODO: uncomment when Helm chart supports Argo Rollouts
      # - name: Wait for Argo Rollouts canary to complete
      #   run: |
      #     kubectl --server "${{ vars.QA_KUBE_SERVER }}" \
      #             --token  "${{ env.QA_KUBE_TOKEN }}" \
      #       argo rollouts status "${{ env.APP_NAME }}" \
      #         --namespace qa --timeout 600

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 11 · E2E tests (Playwright) against QA
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-qa:
    name: "11 · QA E2E Tests"
    runs-on: ubuntu-latest
    needs: deploy-qa
    timeout-minutes: 20
    env:
      NODE_VERSION: "24"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against QA
        run: SKIP_DEV_SERVER=1 npm run test:e2e
        env:
          BASE_URL: ${{ vars.QA_APP_URL }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report-qa
          path: playwright-report/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 12 · Smoke test (health + core API endpoints)
  # ─────────────────────────────────────────────────────────────────────────────
  smoke-qa:
    name: "12 · Smoke Test — QA"
    runs-on: ubuntu-latest
    needs: deploy-qa
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Health check
        run: |
          URL="${{ vars.QA_APP_URL }}"
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${URL}/api/health")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed — HTTP ${STATUS}"
            exit 1
          fi
          echo "Health check passed (HTTP ${STATUS})"

      - name: Core API smoke tests
        run: |
          URL="${{ vars.QA_APP_URL }}"
          curl -sf "${URL}/api/todos" -o /dev/null && echo "GET /api/todos OK"

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 13 · OWASP ZAP full scan against QA (deeper than baseline)
  # ─────────────────────────────────────────────────────────────────────────────
  dast-qa:
    name: "13 · DAST (ZAP full scan) — QA"
    runs-on: ubuntu-latest
    needs: [e2e-qa, smoke-qa]
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: ZAP full scan
        uses: zaproxy/action-full-scan@0f8503472afc3d03963d42a593629622d1a8c13b # v0.11.0
        with:
          target: ${{ vars.QA_APP_URL }}
          fail_action: true
          rules_file_name: .zap/rules.tsv
          cmd_options: "-j"

      - name: Upload ZAP report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zap-qa-report
          path: report_html.html
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 14 · Sign the qa-approval record (keyless, GitHub OIDC).
  # This is what promote-prod's verify-chain will require. Issued by THIS
  # workflow's identity only after E2E + smoke + full DAST all passed.
  # ─────────────────────────────────────────────────────────────────────────────
  attest-qa-approval:
    name: "14 · Attest QA Approval"
    runs-on: ubuntu-latest
    needs: [verify-chain, e2e-qa, smoke-qa, dast-qa]
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Build qa-approval predicate
        run: |
          set -euo pipefail
          cat > approval.json <<EOF
          {
            "environment": "qa",
            "requires": "dev",
            "image": "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}",
            "digest": "${{ inputs.image_digest }}",
            "tag": "${{ needs.verify-chain.outputs.tag }}",
            "commit": "${{ needs.verify-chain.outputs.commit }}",
            "source_repo": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}",
            "promoted_by": "${{ github.actor }}",
            "validated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "evidence": { "e2e": "passed", "smoke": "passed", "dast_full": "passed" }
          }
          EOF

      - name: Sign qa-approval attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          subject-digest: ${{ inputs.image_digest }}
          predicate-type: https://extreme-lab.dev/promotion/qa/v1
          predicate-path: approval.json
          push-to-registry: false
