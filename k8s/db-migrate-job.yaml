apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  labels:
    app: todo-app
    component: migration
  # Automatically deleted 120 s after completion so it doesn't clutter the cluster
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: todo-app
        component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: flyway
          image: flyway/flyway:10-alpine
          args: ["migrate"]
          env:
            - name: FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: todo-app-db-secret
                  key: FLYWAY_URL          # jdbc:postgresql://host:5432/todos
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: todo-app-db-secret
                  key: DB_USER
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-app-db-secret
                  key: DB_PASSWORD
            - name: FLYWAY_SCHEMAS
              value: "public"
            - name: FLYWAY_LOCATIONS
              value: "filesystem:/flyway/sql"
            - name: FLYWAY_VALIDATE_ON_MIGRATE
              value: "true"
            - name: FLYWAY_OUT_OF_ORDER
              value: "false"
          volumeMounts:
            - name: migrations
              mountPath: /flyway/sql
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: migrations
          configMap:
            name: todo-app-migrations
